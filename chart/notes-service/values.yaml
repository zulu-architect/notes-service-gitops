image:
  # Full ECR URL without a tag: `terraform output ecr_repository_url`
  repository: 422653420415.dkr.ecr.af-south-1.amazonaws.com/notes-service
  # The one line CI rewrites in Phase 9. Commit SHA, never "latest" (ECR tags are IMMUTABLE).
  # 0.0.1 is the manually pushed bootstrap image; Phase 8's pipeline switches to SHA tags.
  tag: "ea7b7d0"
  pullPolicy: IfNotPresent
  # Created by hand on the cluster, never in Git (ECR token expires after 12h)
  pullSecretName: ecr-pull

replicaCount: 1

# t3.large hosts Argo CD + Rancher + Vault + Postgres + this app; keep the JVM bounded
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 640Mi

serviceAccount:
  # Must match the Vault Kubernetes-auth role bound in bootstrap.sh
  name: notes-service

service:
  port: 8080

ingress:
  enabled: true
  # sslip.io resolves to the IP in the name; update when the EC2 public IP changes
  host: notes.13.245.143.42.sslip.io

vault:
  # Spring Cloud Vault: KUBERNETES auth against the in-cluster dev-mode Vault
  host: vault.vault.svc
  role: notes-service

postgres:
  image: postgres:17
  database: notes
  # Created by hand from ~/vault-seed.env, never in Git. Keys: username, password
  secretName: notes-postgres
  storage: 1Gi
