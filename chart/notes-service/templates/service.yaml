apiVersion: v1
kind: Service
metadata:
  name: notes-service
  labels:
    {{- include "notes-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  # Routes to any pod carrying these labels: the same ones the Deployment selects on
  selector:
    {{- include "notes-service.selectorLabels" . | nindent 4 }}
