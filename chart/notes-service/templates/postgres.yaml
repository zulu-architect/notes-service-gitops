apiVersion: v1
kind: Service
metadata:
  # DB_URL in the Deployment points at this name
  name: notes-postgres
  labels:
    app.kubernetes.io/name: notes-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: notes-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notes-postgres
  labels:
    app.kubernetes.io/name: notes-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: notes-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notes-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            # Same credentials Vault holds for the app; the Secret is created by hand from ~/vault-seed.env
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: password
            # Data in a subdirectory: a freshly mounted volume root can contain files that make initdb refuse to run
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # One PVC per replica, provisioned by k3s's default local-path storage class
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
